on:
  push:
    branches:
      - main
  pull_request:
name: CI
jobs:
  formatted:
    name: Formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Activate Hermit
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - run: |
          just fmt
          git diff --exit-code
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Activate Hermit
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - name: Run tests
        run: just test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Activate Hermit
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - run: just lint
