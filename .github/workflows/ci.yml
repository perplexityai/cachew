on:
  push:
    branches:
      - main
  pull_request:
name: CI
jobs:
  formatted:
    name: Formatted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Activate Hermit
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - run: |
          just fmt
          git diff --exit-code
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Activate Hermit
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - name: Run tests
        run: just test
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Activate Hermit
        run: ./bin/hermit env --raw >> "$GITHUB_ENV"
      - run: just lint
